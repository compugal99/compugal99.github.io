---
name: Markdown Lint
on:
  pull_request:
    branches: [master]
    paths:
      - '_posts/**/**.md'

jobs:
  # Then check the markdown files are properly formatted
  analyze:
    name: Markdown Lint
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Check markdown files are markdown-lint compliant
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Lint markdown files with markdown-lint
        id: lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          # Includes some specific rules to ignore
          config: .github/workflows/markdownlint-config.json
          globs: |
            _posts/**/*.md
            !site/**

  notify:
    name: Report Status
    runs-on: ubuntu-latest
    needs: [analyze]
    if: always() && (needs.analyze.result == 'failure')
    steps:
      - name: Failure Notification
        uses: niniyas/ntfy-action@master
        with:
          url: 'https://notifications.compuguy.dev'
          topic: 'github'
          priority: 3
          tags: action,failed
          details: Markdown linting failed! Review the logs and fix immediately!
